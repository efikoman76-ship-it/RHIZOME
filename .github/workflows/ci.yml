name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  # Windows is the only build target for CI by request (ADR 0002). Every step
  # runs through scripts/ci-step.sh, which tees full output into the log and
  # re-emits the tail as ::error:: annotations so a red run can be diagnosed
  # from the run summary alone, without downloading artifacts.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        shell: bash
        run: bash scripts/ci-step.sh fmt "cargo fmt --all -- --check"

      - name: clippy
        shell: bash
        run: bash scripts/ci-step.sh clippy "cargo clippy --workspace --all-targets -- -D warnings"

      - name: build
        shell: bash
        run: bash scripts/ci-step.sh build "cargo build --workspace --all-targets"

      - name: test
        shell: bash
        run: bash scripts/ci-step.sh test "cargo test --workspace -- --nocapture"

      - name: doc
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: bash scripts/ci-step.sh doc "cargo doc --no-deps --workspace"

      - name: params
        shell: bash
        run: |
          bash scripts/ci-step.sh params "cargo run -q -p rhizome-cli -- params --format=markdown"
          {
            echo '## rhizome params --format=markdown'
            echo
            cat logs/params.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verify
        shell: bash
        run: bash scripts/ci-step.sh verify "cargo run -q -p rhizome-cli -- verify"

      - name: spec-sync
        shell: bash
        run: bash scripts/ci-step.sh spec-check "cargo run -q -p rhizome-cli -- spec-check"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs/
          if-no-files-found: ignore
